appId: 'bermudalauncher'
productName: 'Bermuda Launcher'
artifactName: 'Bermuda-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2026 Daniel Scalzi, Copyright © 2024 peunsu, Copyright © 2026 ycarrot1'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Bermuda-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi, peunsu, ycarrot1'
  vendor: 'Daniel Scalzi, peunsu, ycarrot1'
  synopsis: 'Custom Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'

publish:
  provider: 'github'
  owner: 'ycarrot1'
  repo: 'BermudaLauncher'
  releaseType: 'release'

directories:
  buildResources: 'build'
  output: 'dist'